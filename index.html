<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <div class="avatar">
          <img src="./assets/images/avatar-jessica.jpeg" alt="avatar-jessica" />
          <span><strong>Jessica Randall</strong></span>
          <span>London, United Kingdom</span>
        </div>
        <div class="info">
          <span>"Front-end developer and avid reader."</span>
        </div>
        <div class="socials">
          <div class="socials-button">GitHub</div>
          <div class="socials-button">Frontend Mentor</div>
          <div class="socials-button">LinkedIn</div>
          <div class="socials-button">Twitter</div>
          <div class="socials-button">Instagram</div>
        </div>
      </div>
    </main>

    <footer>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="https://www.frontendmentor.io/profile/ChristopherJavier">Christopher Javier</a>.
      </div>
    </footer>
  </body>
</html>
